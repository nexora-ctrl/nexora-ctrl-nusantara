<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orbitGrad" x1="50" y1="50" x2="520" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="45%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0047AB"/>
    </linearGradient>

    <linearGradient id="nLeftGrad" x1="180" y1="40" x2="270" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077FE"/>
      <stop offset="60%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>

    <linearGradient id="nDiagGrad" x1="200" y1="40" x2="380" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003893"/>
    </linearGradient>

    <linearGradient id="nRightGrad" x1="320" y1="40" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="50%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#0040A8"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowEffect" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#002b80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Back Orbit Section -->
  <path d="M 120 185 C 130 90, 240 25, 410 45 C 490 55, 525 105, 475 160 C 445 195, 390 220, 320 230" 
        stroke="url(#orbitGrad)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Logo Mark N with House Integration -->
  <g filter="url(#shadowEffect)">
    <!-- Left vertical bar of N -->
    <path d="M 215 50 L 268 50 L 268 235 L 215 235 Z" fill="url(#nLeftGrad)"/>

    <!-- Diagonal slash of N -->
    <path d="M 268 50 L 365 200 L 320 200 L 220 50 Z" fill="url(#nDiagGrad)"/>

    <!-- Right vertical bar of N -->
    <path d="M 320 50 L 372 50 L 372 170 L 320 100 Z" fill="url(#nRightGrad)"/>

    <!-- House Roof Silhouette -->
    <path d="M 290 235 L 365 155 L 440 235 L 420 235 L 365 175 L 310 235 Z" fill="#0047AB"/>
    
    <!-- House 4-window Grid -->
    <rect x="370" y="195" width="16" height="16" rx="2" fill="#003893"/>
    <rect x="392" y="195" width="16" height="16" rx="2" fill="#003893"/>
    <rect x="370" y="217" width="16" height="16" rx="2" fill="#003893"/>
    <rect x="392" y="217" width="16" height="16" rx="2" fill="#003893"/>
  </g>

  <!-- Front Dynamic Orbit Swoosh -->
  <path d="M 90 215 C 120 260, 240 270, 345 220 C 440 175, 485 110, 480 75 C 478 65, 465 60, 450 65 C 430 75, 410 100, 370 140 C 310 200, 200 240, 110 218 C 95 214, 85 208, 90 215 Z" 
        fill="url(#orbitGrad)" filter="url(#glowEffect)"/>

  <!-- Brand Typography: NEXORA -->
  <g class="brand-text">
    <text x="300" y="305" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="62" 
          font-weight="900" 
          letter-spacing="5" 
          fill="currentColor" 
          text-anchor="middle">NEXORA</text>
  </g>

  <!-- Sub-bar: CTRL NUSANTARA -->
  <g class="sub-text">
    <line x1="85" y1="330" x2="165" y2="330" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    
    <text x="300" y="336" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
          font-size="20" 
          font-weight="800" 
          letter-spacing="6" 
          fill="currentColor" 
          text-anchor="middle">CTRL NUSANTARA</text>
    
    <polygon points="418,335 425,322 432,335" fill="url(#cyanAccent)"/>
    <line x1="435" y1="330" x2="515" y2="330" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tagline: Digital Solution for a Better Future -->
  <text x="300" y="365" 
        font-family="'Playfair Display', Georgia, 'Plus Jakarta Sans', italic, serif" 
        font-style="italic" 
        font-size="19" 
        font-weight="600" 
        fill="#0066FF" 
        text-anchor="middle">Digital Solution for a Better Future</text>
</svg>

