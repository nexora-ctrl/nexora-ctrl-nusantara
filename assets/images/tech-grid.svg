<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="dotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00c0f3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0056e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fine Grid Lines -->
  <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#0056e0" stroke-width="0.75" stroke-opacity="0.08"/>
  <path d="M 50 0 L 50 100 M 0 50 L 100 50" fill="none" stroke="#00c0f3" stroke-width="0.5" stroke-opacity="0.05" stroke-dasharray="2 3"/>
  <!-- Glowing Intersection Tech Nodes -->
  <circle cx="0" cy="0" r="2.5" fill="url(#dotGrad)"/>
  <circle cx="100" cy="0" r="2.5" fill="url(#dotGrad)"/>
  <circle cx="0" cy="100" r="2.5" fill="url(#dotGrad)"/>
  <circle cx="100" cy="100" r="2.5" fill="url(#dotGrad)"/>
  <circle cx="50" cy="50" r="1.5" fill="#00c0f3" fill-opacity="0.15"/>
</svg>

