  <path d="M 44 24 L 66 65 L 57 65 L 34 24 Z" fill="url(#orbitIconGrad)"/>
  <path d="M 57 24 L 69 24 L 69 58 L 57 40 Z" fill="#0055d4"/>
  <!-- House Roof -->
  <path d="M 49 76 L 68 56 L 87 76 L 82 76 L 68 62 L 54 76 Z" fill="#003893"/>
