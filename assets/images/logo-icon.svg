  <rect x="69" y="66" width="4.5" height="4.5" rx="0.5" fill="#00D2FF"/>
  <rect x="75" y="66" width="4.5" height="4.5" rx="0.5" fill="#00D2FF"/>
  <rect x="69" y="72" width="4.5" height="4.5" rx="0.5" fill="#00D2FF"/>
  <rect x="75" y="72" width="4.5" height="4.5" rx="0.5" fill="#00D2FF"/>
  <!-- Front Orbit Swoosh -->
  <path d="M 15 54 C 22 66, 48 70, 70 58 C 88 48, 96 32, 95 24 C 92 27, 85 36, 75 45 C 60 58, 38 65, 20 57 C 16 55, 14 53, 15 54 Z" 
