<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orbitIconGrad" x1="10" y1="10" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>
    <linearGradient id="nGrad" x1="25" y1="20" x2="75" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077FE"/>
      <stop offset="100%" stop-color="#002b80"/>
    </linearGradient>
  </defs>
  <!-- Back Orbit -->
  <path d="M 22 45 C 24 22, 50 10, 80 16 C 92 18, 98 28, 92 40 C 86 48, 72 55, 60 57" 
        stroke="url(#orbitIconGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
